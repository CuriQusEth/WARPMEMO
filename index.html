    <script>
      // Defensive shim against multiple Web3 wallet extensions (e.g. Zerion, MetaMask, Coinbase) 
      // colliding on non-configurable properties like window.ethereum.isZerion
      (function() {
        var originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          try {
            if (descriptor && typeof descriptor === 'object' && descriptor.configurable === undefined) {
              descriptor.configurable = true;
            }
            return originalDefineProperty.call(Object, obj, prop, descriptor);
          } catch (err) {
            if (err instanceof TypeError && typeof err.message === 'string' && err.message.indexOf('Cannot redefine property') !== -1) {
              try {
                if (descriptor && 'value' in descriptor) {
                  obj[prop] = descriptor.value;
                }
              } catch (_) {}
              return obj;
            }
            throw err;
          }
        };

        window.addEventListener('error', function(event) {
          if (event && event.message && typeof event.message === 'string' && event.message.indexOf('isZerion') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && typeof event.reason.message === 'string' && event.reason.message.indexOf('isZerion') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
